org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP registers its generated sources through the Kotlin source-set DSL, which
# AGP 9's built-in Kotlin rejects unless this is set.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
