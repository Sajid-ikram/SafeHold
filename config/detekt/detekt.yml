# Overrides on top of detekt's default config (run with --build-upon-default-config).

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInObjects: 20
    ignorePrivate: true
  CyclomaticComplexMethod:
    threshold: 18
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    mustBeFirst: true

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreAnnotated: ['Composable', 'Preview']
    # Byte-format parsers and design tokens are made of literal numbers; naming each
    # offset and colour would hide what the specs say.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/designsystem/theme/**'
      - '**/designsystem/icon/**'
      - '**/core/filetype/src/main/**'
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
